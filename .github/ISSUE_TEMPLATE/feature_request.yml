name: "💡 Feature Request"
description: "Suggest an idea or enhancement for Waycord"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe your proposed addition or improvement below.

  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear description of what the problem is."
      placeholder: "I'm always frustrated when..."

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Feature"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've considered."

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add any other context, screenshots, or mockups about the feature request here."
